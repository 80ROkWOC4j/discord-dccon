name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check release version
        run: |
          @'
          const fs = require('node:fs');
          const version = require('./package.json').version;
          const plugin = fs.readFileSync('discord-dccon.plugin.js', 'utf8').match(/@version\s+(\S+)/)?.[1];
          const tag = process.env.GITHUB_REF_NAME;
          if (!/^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(tag) || tag !== `v${version}` || plugin !== version) {
            throw Error(`Version mismatch: tag=${tag}, package=${version}, plugin=${plugin}`);
          }
          '@ | node
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: npm ci
      # Installer tests build the release packages and exercise them in temporary directories.
      - run: npm test
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF_NAME
          $assets = @('artifacts/dist/discord-dccon-betterdiscord.zip', 'artifacts/dist/discord-dccon-standalone.zip', 'artifacts/dist/checksums.json', 'discord-dccon.plugin.js', 'install.ps1', 'install.sh')
          foreach ($asset in $assets) { if (!(Test-Path -LiteralPath $asset)) { throw "Missing release asset: $asset" } }
          $existing = gh release view $tag --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (!(($existing | ConvertFrom-Json).isDraft)) { throw 'This release is already published; do not replace its assets.' }
          } else {
            gh release create $tag --verify-tag --draft --title $tag --generate-notes
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed.' }
          }
          gh release upload $tag @assets --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Asset upload failed; release remains a draft.' }
          if ($tag.Contains('-')) { gh release edit $tag --draft=false --prerelease }
          else { gh release edit $tag --draft=false }
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
